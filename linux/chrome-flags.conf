# google-chrome-stable の起動フラグ
# /usr/bin/google-chrome-stable が起動時に読み込む (# 始まりの行は無視される)

# XWayland ではなくネイティブ Wayland で動かす。
# hint=auto にしておくと Wayland が無い環境では X11 に自動で落ちるため、
# TTY や X11 セッションで起動しても壊れない。
--ozone-platform-hint=auto

# Wayland ネイティブ時は既定で IME が無効。これが無いと fcitx5/mozc で
# 日本語が入力できなくなる。
--enable-wayland-ime

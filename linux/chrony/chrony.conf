# /etc/chrony.conf — arch-dev (W-dev-pc) / client 専用
#
# ソース選定の実測根拠 (2026-10-06):
#   192.168.1.1 (OPNsense)  stratum 2  RTT 0.39ms  誤差上限 +/-26ms
#   ntp.nict.jp             stratum 1  RTT 33ms    誤差上限 +/-15ms
# LAN は低ジッタだが OPNsense 自身が WAN 経由で同期するため root dispersion が乗る。
# prefer は付けず、chrony に全ソースを結合させて絶対精度を取る。

# LAN の OPNsense。ポーリングを 16〜64 秒に詰めて追従を速くする (LAN なので負荷は無視できる)
server 192.168.1.1 iburst minpoll 4 maxpoll 6

# NICT の stratum-1 (5 アドレス)。pool で複数台を同時参照し外れ値を統計的に除外する
pool ntp.nict.jp iburst maxsources 3

# インターネットマルチフィード (stratum-2) を予備系に
server ntp1.jst.mfeed.ad.jp iburst
server ntp2.jst.mfeed.ad.jp iburst

# 起動直後の最初の 3 回だけ、1 秒以上ズレていれば slew せず step する。
# WoL で S5 から起動するため、停止中に溜まった RTC のズレを即座に潰す。
# 4 回目以降は step しないので、稼働中のプロセスから時刻が飛んで見えることはない
makestep 1.0 3

# 11 分ごとにカーネルがシステム時刻を RTC へ書き戻す。次回の電源投入時に RTC が正しい値から始まる。
# chrony 側の rtcfile/rtcautotrim は使わない — chronyd.service の ExecStart が
# `chronyd -n` で `-s` を渡さないため、RTC からの起動時刻補正が効かない
rtcsync

# うるう秒は IERS 由来の権威リストから取得する (tzdata が更新・現行の期限は 2027-06-28)
leapseclist /usr/share/zoneinfo/leap-seconds.list

# 周波数ドリフトの学習結果を保存し、再起動直後から補正を効かせる
driftfile /var/lib/chrony/drift

# 停止時に測定履歴を保存する。電源断の多いマシンなので次回起動の再収束が速くなる
dumpdir /var/lib/chrony

# NTP サーバーとしては待ち受けない (client 専用)
port 0

# ファイルログは有効にしない。このマシンには logrotate が無く、
# /etc/logrotate.d/chrony があってもローテーションされず無制限に増えるため。
# 稼働状況は chronyc tracking / sources / sourcestats で見る
